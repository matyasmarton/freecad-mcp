[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freecad-mcp"
version = "0.1.0"
description = "Hand-coded MCP server exposing parametric FreeCAD operations as LLM tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp==1.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
freecad-mcp = "freecad_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

